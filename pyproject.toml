[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "arca-codex"
version = "0.1.1"
description = "MCP local para Factura C y FCE C, conectado directamente a ARCA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp>=1.26,<2", "cryptography>=46,<49", "defusedxml>=0.7,<1",
  "filelock>=3.20,<4", "keyring>=25,<26", "reportlab>=4.4,<5",
  "httpx>=0.28,<1",
  "tzdata>=2025.2",
]

[project.scripts]
arca-codex = "arca_codex.cli:main"
arca-codex-mcp = "arca_codex.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/arca_codex"]
